name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[colab,dev]"
      - run: python -m pytest competition-kit/tests -q
      - run: ruff check competition-kit/ensemble_benchmark scripts
      - run: mypy
      - run: python scripts/build_guide.py --check
